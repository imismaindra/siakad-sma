name: Deploy to cPanel (via main)

on:
  push:
    branches:
      - main
      - v2.0-development
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge-and-deploy:
    name: 🚀 Merge & Deploy to cPanel
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # Jika push dari v2.0-development, otomatis merge ke main dan push ke origin main
      - name: 🔀 Auto-merge v2.0-development to main
        if: github.ref == 'refs/heads/v2.0-development'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "Switching to main branch..."
          git checkout main
          echo "Merging v2.0-development into main..."
          git merge origin/v2.0-development -m "ci: auto-merge v2.0-development into main [skip ci]"
          echo "Pushing updated main branch..."
          git push origin main

      # Pastikan runner menggunakan branch main
      - name: 🌿 Ensure on main branch
        run: |
          git checkout main

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Node Dependencies & Build Assets
        run: |
          npm ci
          npm run build

      - name: 📤 Upload Build Assets (public/build) to cPanel
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: 'public/build'
          target: '${{ secrets.DEPLOY_PATH }}'

      - name: ⚡ Execute Remote Deployment on cPanel (main branch)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            echo "📂 Navigating to deployment directory..."
            cd ${{ secrets.DEPLOY_PATH }}

            echo "🔄 Pulling latest changes from origin main..."
            git pull origin main

            echo "📦 Installing PHP dependencies..."
            composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

            echo "🗄️ Running database migrations..."
            php artisan migrate --force

            echo "⚡ Clearing and creating cache..."
            php artisan optimize:clear
            php artisan optimize

            echo "✅ Deployment on main branch completed successfully!"
